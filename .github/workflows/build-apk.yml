name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ZDownloader PRO APK (Free Cloud Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZDownloader-PRO-v1.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZDownloader-PRO-v1.0.apk
          path: ZDownloader-PRO-v1.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: ZDownloader PRO Android APK v1.0
          body: |
            ### 📱 ZDownloader PRO — Official Android APK v1.0
            - ⚡ **100% Free & Standalone (No Paid Cloud / Zero Card Required)**
            - 📥 **Direct Android DownloadManager**: Saves directly to Phone Downloads / Gallery
            - 🔗 **Share Link Support**: Share videos directly from Instagram, Facebook, TikTok, YouTube
            - 🚫 **No 3rd-Party Redirects**: Direct video stream extraction
          files: ZDownloader-PRO-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
